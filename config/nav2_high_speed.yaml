# High Speed Navigation Config - 5 m/s
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB High Speed Configuration - 5 m/s
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 5.0                    # 5 m/s maximum speed
      max_vel_y: 0.0
      max_vel_theta: 2.0                # High angular speed
      min_speed_xy: 0.0
      max_speed_xy: 5.0                 # 5 m/s maximum speed
      min_speed_theta: 0.0
      acc_lim_x: 4.0                    # High acceleration
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -4.0                 # High deceleration
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 30                    # More samples for high speed
      vy_samples: 5
      vtheta_samples: 40
      sim_time: 2.5                     # Longer prediction for high speed
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [5.0, 0.0, 2.0]       # 5 m/s linear, 2 rad/s angular
    min_velocity: [-5.0, 0.0, -2.0]
    max_accel: [4.0, 0.0, 3.2]          # High acceleration limits
    max_decel: [-4.0, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0